name: Update translators card

# Re-generates .github/images/translators-{light,dark}.png whenever the contributor list
# changes (e.g. after the all-contributors bot PR is merged).
on:
  push:
    branches: [master]
    paths:
      - ".all-contributorsrc"
      - "scripts/generate-translators-svg.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get install -y --no-install-recommends fonts-roboto
      - run: npm i --no-save @resvg/resvg-js
      - run: node scripts/generate-translators-svg.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch .github/images/translators.svg
          git add .github/images/translators-light.png .github/images/translators-dark.png
          git diff --cached --quiet || (git commit -m "chore: update translators card" && git push)
